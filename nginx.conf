server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't expose repo/meta files if present in the mount
    location ~* ^/(README|\.git|docker-compose|nginx\.conf|\.gitignore) {
        return 404;
    }

    location ~* \.(md|png)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /resume/index.html {
        add_header Cache-Control "no-cache";
    }
}
