server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't expose repo/meta files if present in the mount
    location ~* ^/(README|\.git|docker-compose|nginx\.conf|\.gitignore) {
        return 404;
    }

    location ~* \.md$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Images can cache longer; CSS/HTML should refresh during iteration
    location /assets/images/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location /assets/css/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /resume/index.html {
        add_header Cache-Control "no-cache";
    }
}
